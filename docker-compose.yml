# e-LLK — single-host deployment (app + nginx + MySQL)
# Usage:
#   cp .env.docker .env   # then edit passwords
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: e-llk-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: e-llk-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads_data:/var/www/html/public/uploads:ro
    depends_on:
      - app
    networks:
      - internal

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

volumes:
  db_data:
  storage_data:
  uploads_data:

networks:
  internal:
